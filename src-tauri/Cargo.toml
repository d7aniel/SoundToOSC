[package]
name = "sound-to-osc"
version = "0.1.0"
description = "Audio Analysis to OSC Transmitter for Andragon"
authors = ["Emmelab"]
edition = "2021"

[lib]
name = "sound_to_osc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rosc = "0.11"
realfft = "3.4"
ringbuf = "0.4"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

