name: Build macOS Desktop App

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (App bundle only)
        # We tell Tauri to build just the bundle app, avoiding automatic DMG packaging before signing
        run: npx @tauri-apps/cli build --bundles app

      - name: Sign App Bundle (Ad-hoc)
        # This applies a local ad-hoc signature so macOS recognizes the bundle structure and allows the "Open Anyway" prompt
        run: |
          codesign --force --deep -s - src-tauri/target/release/bundle/macos/SoundToOSC.app
          # Verify that the bundle seal is strictly valid
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/SoundToOSC.app

      - name: Create DMG using native macOS tools
        # We use macOS's native hdiutil to pack the signed .app into a clean DMG
        run: |
          DMG_NAME="SoundToOSC-macOS.dmg"
          APP_PATH="src-tauri/target/release/bundle/macos/SoundToOSC.app"
          
          # Create a temporary folder for staging the DMG contents
          mkdir -p dist_dmg
          # Use ditto to preserve permissions, symlinks, and code signature integrity
          ditto "$APP_PATH" "dist_dmg/SoundToOSC.app"
          ln -s /Applications dist_dmg/Applications
          
          # Generate the final compressed DMG image
          hdiutil create -volname "SoundToOSC" \
                         -srcfolder dist_dmg \
                         -ov -format UDZO \
                         "$DMG_NAME"
          
          # Move DMG to Tauri's expected output path for consistency
          mkdir -p src-tauri/target/release/bundle/dmg
          mv "$DMG_NAME" src-tauri/target/release/bundle/dmg/

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: SoundToOSC-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error