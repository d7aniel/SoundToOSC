name: Build Windows and Linux Desktop Apps

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npx @tauri-apps/cli build

      - name: Package Windows files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_windows
          Copy-Item "src-tauri/target/release/SoundToOSC.exe" -Destination "dist_windows/SoundToOSC.exe"
          if (Test-Path "src-tauri/target/release/bundle/nsis/*.exe") {
            Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" -Destination "dist_windows/"
          }
          if (Test-Path "src-tauri/target/release/bundle/msi/*.msi") {
            Copy-Item "src-tauri/target/release/bundle/msi/*.msi" -Destination "dist_windows/"
          }
          Compress-Archive -Path "dist_windows/*" -DestinationPath "SoundToOSC-windows.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundToOSC-windows
          path: SoundToOSC-windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            zip
          # AppImage runtime compatibility for newer Ubuntu runners
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npx @tauri-apps/cli build

      - name: Package Linux files
        run: |
          mkdir -p dist_linux
          cp src-tauri/target/release/SoundToOSC dist_linux/SoundToOSC
          chmod +x dist_linux/SoundToOSC
          # Copy AppImage and deb if created by the bundler
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} dist_linux/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} dist_linux/ \; 2>/dev/null || true
          cd dist_linux
          zip -r ../SoundToOSC-linux.zip *
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundToOSC-linux
          path: SoundToOSC-linux.zip
          if-no-files-found: error
